services:
  mock:
    build: .
    command: python -m tests.mock_upstream
    environment:
      HOST: 0.0.0.0
  gateway:
    build: .
    command: python -m gateway.server
    environment:
      HOST: 0.0.0.0
      UPSTREAM_URL: http://mock:9000
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-64}
      CONNECTION_TIMEOUT_SECONDS: ${CONNECTION_TIMEOUT_SECONDS:-10}
      REQUEST_DEADLINE_SECONDS: ${REQUEST_DEADLINE_SECONDS:-120}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mock
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway
  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
