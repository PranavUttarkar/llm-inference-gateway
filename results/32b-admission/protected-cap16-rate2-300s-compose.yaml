name: llm-inference-gateway
services:
  backend:
    command:
      - python3
      - /app/start_backend.py
    environment:
      GPU_MEMORY_UTILIZATION: "0.9"
      MAX_NUM_SEQS: "32"
      MODEL_ID: Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
      MODEL_REVISION: eddc13f573fd3648cc8a4741fdf1b70e8d6fc5c1
      TP_SIZE: "2"
    gpus:
      - count: -1
    image: nvcr.io/nvidia/tritonserver:25.08-vllm-python-py3@sha256:782b60ab5c9ec57f045bfb1df91831a98cc0d094314fadaf8cf80e53581f79da
    networks:
      default: null
    shm_size: "2147483648"
    volumes:
      - type: bind
        source: /root/llm-inference-gateway/deploy/start_backend.py
        target: /app/start_backend.py
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: model-cache
        target: /root/.cache/huggingface
        volume: {}
  gateway:
    build:
      context: /root/llm-inference-gateway
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - gateway.server
    depends_on:
      backend:
        condition: service_started
        required: true
    environment:
      HOST: 0.0.0.0
      MAX_ACTIVE: "16"
      UPSTREAM_TIMEOUT_SECONDS: "120"
      UPSTREAM_URL: http://backend:9000
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
  grafana:
    depends_on:
      prometheus:
        condition: service_started
        required: true
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3000
        published: "3000"
        protocol: tcp
    volumes:
      - type: bind
        source: /root/llm-inference-gateway/monitoring/grafana
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: true
  prometheus:
    depends_on:
      gateway:
        condition: service_started
        required: true
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9090
        published: "9090"
        protocol: tcp
    volumes:
      - type: bind
        source: /root/llm-inference-gateway/monitoring/prometheus.gpu.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: true
networks:
  default:
    name: llm-inference-gateway_default
volumes:
  model-cache:
    name: llm-inference-gateway_model-cache
